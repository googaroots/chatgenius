<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Trainings-App für den Technogym HIT 5er-Split: zeigt jeden Tag die richtige Einheit, rechnet die Aufwärmsätze aus dem Top-Set und schlägt das nächste Gewicht vor.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#121419">
  <title>Top Set</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23121419'/%3E%3Crect x='5' y='14' width='22' height='4' rx='2' fill='%23E4523C'/%3E%3Crect x='3' y='11' width='4' height='10' rx='1.5' fill='%23E8A33D'/%3E%3Crect x='25' y='11' width='4' height='10' rx='1.5' fill='%23E8A33D'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <span class="brand"><strong>Top Set</strong><span id="brand-sub">HIT 5er-Split</span></span>
      <button class="icon-btn" data-act="sheet" aria-label="Einstellungen">☰</button>
    </div>
  </header>

  <main id="main" class="wrap view" aria-live="polite"></main>

  <div id="sheet"></div>

  <div class="timer" id="timer" hidden>
    <div class="timer-inner">
      <span class="timer-count data">0:00</span>
      <span class="timer-label">Pause</span>
      <button class="btn btn-ghost btn-sm" data-act="timer-plus">+30 s</button>
      <button class="btn btn-sm" data-act="timer-stop">Fertig</button>
    </div>
  </div>

  <nav class="tabs" aria-label="Bereiche">
    <div class="wrap">
      <button class="tab" data-view="today" role="tab" aria-selected="true"><span class="glyph">◉</span>Heute</button>
      <button class="tab" data-view="plan" role="tab" aria-selected="false"><span class="glyph">▤</span>Plan</button>
      <button class="tab" data-view="progress" role="tab" aria-selected="false"><span class="glyph">▲</span>Fortschritt</button>
    </div>
  </nav>

  <script src="plan.js"></script>
  <script src="app.js"></script>
</body>
</html>
